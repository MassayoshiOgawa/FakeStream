name: Gerar APK de arquivo ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código garantindo que arquivos grandes e binários venham junto
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true

    # 2. Mostra os arquivos na tela (para conferência no log) e descompacta
    - name: Unzip project
      run: |
        echo "=== Arquivos encontrados no repositório ==="
        ls -la
        echo "==========================================="
        unzip projeto.zip -d projeto_extraido
        if [ -d "projeto_extraido" ]; then
          mv projeto_extraido/* . 2>/dev/null || true
          mv projeto_extraido/.* . 2>/dev/null || true
          rm -rf projeto_extraido
        fi

    # 3. Configura o Java
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 4. Dá permissão de execução para o script do Gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. Compila o projeto e gera o APK
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # 6. Disponibiliza o APK gerado para download
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
