name: Gerar APK de arquivo ZIP

on:
  push:
    branches: [ "main" ] # Executa sempre que houver push na branch main
  workflow_dispatch: # Permite rodar o processo manualmente pelo painel do GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código do repositório (onde está o seu ZIP)
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Descompacta o seu arquivo ZIP
    - name: Unzip project
      run: |
        unzip projeto.zip -d projeto_extraido
        if [ -d "projeto_extraido" ]; then
          mv projeto_extraido/* . 2>/dev/null || true
          mv projeto_extraido/.* . 2>/dev/null || true
          rm -rf projeto_extraido
        fi

    # 3. Configura o Java (necessário para compilar Android)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 4. Dá permissão de execução para o script do Gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. Compila o projeto e gera o APK em modo Debug
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # 6. Disponibiliza o APK gerado para download
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
